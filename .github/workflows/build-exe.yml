name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm KML_Style_Synchronizer.spec

      - name: Verify standalone EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\KML_Style_Synchronizer.exe")) {
            throw "KML_Style_Synchronizer.exe was not created."
          }
          Get-Item "dist\KML_Style_Synchronizer.exe" | Format-List FullName,Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KML_Style_Synchronizer-Windows
          path: dist/KML_Style_Synchronizer.exe
