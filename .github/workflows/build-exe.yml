name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m compileall -q main.py kml_style_sync tests
          if ($LASTEXITCODE -ne 0) { throw "Python source validation failed." }

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build one-file Windows EXE
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name KML_Style_Synchronizer main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist\KML_Style_Synchronizer.exe"
          if (!(Test-Path $exe)) { throw "EXE was not created: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 100000) { throw "EXE is unexpectedly small: $($item.Length) bytes" }
          Write-Host "EXE: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: KML_Style_Synchronizer-Windows-x64
          path: dist/KML_Style_Synchronizer.exe
          if-no-files-found: error
          retention-days: 30
